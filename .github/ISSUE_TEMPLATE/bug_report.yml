name: Bug report
description: Report reproducible incorrect behavior in benchmatrix
title: "bug: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security vulnerabilities, follow SECURITY.md instead of filing a public issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched existing issues for the same problem.
          required: true
        - label: This report does not include secrets, tokens, or private benchmark data.
          required: true
  - type: input
    id: version
    attributes:
      label: benchmatrix version
      description: Run `benchmatrix --version` to find this value.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.14.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, macOS 15, Windows 2025"
    validations:
      required: true
  - type: input
    id: benchmark_dependencies
    attributes:
      label: pytest and pytest-benchmark versions
      description: Run `python -m pytest --version` and include the plugin versions shown there.
      placeholder: "pytest 9.1.1, pytest-benchmark 5.2.3"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest code sample and command that reproduce the issue.
      render: python
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or traceback
      render: shell
  - type: textarea
    id: benchmark_json
    attributes:
      label: Relevant benchmark JSON
      description: Include a minimal sanitized excerpt when the issue involves parsing pytest-benchmark output.
      render: json
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant operating system, dependency versions, or benchmark JSON details.
