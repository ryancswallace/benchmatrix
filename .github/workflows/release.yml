name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* GitHub Release tag whose reviewed assets should be used. Leave empty for a build-only check.
        required: false
        type: string
      publish:
        description: Publish the validated distributions to PyPI.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.21"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify tag and release metadata
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
        run: uv run python scripts/prepare_release.py validate "${RELEASE_REF#v}"

      - name: Download reviewed GitHub Release assets
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Reviewed release assets require a v* tag; got '$RELEASE_TAG'."
              exit 1
              ;;
          esac
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --pattern "benchmatrix-*.tar.gz" \
            --pattern "benchmatrix-*.whl" \
            --pattern "benchmatrix.cdx.json" \
            --dir dist

      - name: Build release assets for manual verification
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        run: make build

      - name: Validate reviewed release assets
        if: github.event_name == 'release' || inputs.tag != ''
        run: |
          make check-dist
          make smoke-dist
          make validate-dist

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Upload package distributions
        uses: actions/upload-artifact@v7
        with:
          name: benchmatrix-release-dist
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
          retention-days: 90

      - name: Upload release SBOM
        uses: actions/upload-artifact@v7
        with:
          name: benchmatrix-release-sbom
          path: dist/*.cdx.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish to PyPI
    if: (github.event_name == 'release' || inputs.publish == 'true') && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v'))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/benchmatrix/

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: benchmatrix-release-dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify:
    name: Verify PyPI install
    if: (github.event_name == 'release' || inputs.publish == 'true') && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v'))
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          release_ref="${RELEASE_REF}"
          case "$release_ref" in
            v*) version="${release_ref#v}" ;;
            *)
              echo "Release verification only runs for v* tags; got '${release_ref}'."
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.21"
          enable-cache: false

      - name: Verify package installation from PyPI
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          verify_env="$(mktemp -d)"
          trap 'rm -rf "$verify_env"' EXIT
          uv venv --quiet "$verify_env"
          for attempt in $(seq 1 20); do
            if VIRTUAL_ENV="$verify_env" uv pip install --quiet "benchmatrix==$VERSION"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Failed to install benchmatrix==$VERSION from PyPI after $attempt attempts."
              exit 1
            fi
            sleep 30
          done
          "$verify_env/bin/python" -c "from benchmatrix import BenchmarkCase; print(BenchmarkCase.__name__)"
          "$verify_env/bin/benchmatrix" --version
          "$verify_env/bin/benchmatrix" policy validate --no-config --quiet
